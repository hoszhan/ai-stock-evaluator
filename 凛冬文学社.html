<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凛冬文学社 · 文学交流圈</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230e1b2f'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%238fc3e6' font-family='serif'%3E%E5%87%9B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#0a1424; --bg2:#0c182c; --surface:rgba(18,31,54,.82); --surface-solid:#12203a;
  --line:rgba(143,195,230,.16); --line-strong:rgba(143,195,230,.34);
  --text:#e9f0f8; --text-dim:#a3b6cf; --text-faint:#7186a3;
  --ice:#8fc3e6; --ice-deep:#5d9cc4; --red:#e0443c; --red-deep:#c7352e;
  --warm:#e9c98a;
  --serif:"Noto Serif SC","Source Han Serif SC","SimSun","STSong","Songti SC",serif;
  --sans:"Noto Sans SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); color:var(--text); background:
    radial-gradient(1100px 520px at 78% -8%, rgba(93,156,196,.16), transparent 60%),
    radial-gradient(900px 480px at 6% 28%, rgba(53,88,134,.20), transparent 62%),
    linear-gradient(180deg, var(--bg2), var(--bg) 42%, #070f1d);
  min-height:100vh; line-height:1.7;
}
/* ===== 顶部标头图 ===== */
.hero{position:relative;width:100%;height:clamp(170px,34vw,300px);overflow:hidden;background:var(--bg2)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:34%;background:linear-gradient(180deg,transparent,rgba(10,20,36,.86));pointer-events:none}

/* ===== 左侧固定入社小方格 ===== */
.join-box{
  position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:60;
  width:56px;height:210px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg, rgba(20,36,62,.96), rgba(12,24,44,.94));
  border:1px solid var(--line-strong);border-left:none;border-radius:0 10px 10px 0;
  writing-mode:vertical-rl;letter-spacing:3px;
  font-size:12.5px;color:var(--ice);text-align:center;
  box-shadow:4px 0 22px rgba(0,0,0,.35);
}
.join-box::before{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:linear-gradient(180deg,var(--ice-deep),transparent 18%,transparent 82%,var(--ice-deep))}

/* ===== 内容容器（为左侧方格让位） ===== */
:root{--gap:68px}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px 0 calc(var(--gap) + 6px)}
@media (min-width:560px){:root{--gap:92px}.join-box{width:80px;height:270px;font-size:13.5px}}
@media (min-width:820px){:root{--gap:118px}.join-box{width:100px;height:330px;font-size:14.5px}}
@media (min-width:1200px){:root{--gap:142px}.join-box{width:124px;height:390px;font-size:15.5px}}

/* ===== 工具栏 ===== */
.toolbar{position:sticky;top:0;z-index:55;background:rgba(10,20,36,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.toolbar-inner{max-width:1060px;margin:0 auto;padding:14px 20px 12px calc(var(--gap) + 6px)}
.toolbar-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:42px;height:42px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#16324f,#0d1d36);border:1px solid var(--line-strong);
  font-family:var(--serif);font-weight:900;font-size:24px;color:var(--ice);
  box-shadow:inset 0 0 14px rgba(143,195,230,.14)
}
.brand h1{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:2px;line-height:1.25}
.brand p{font-size:11.5px;color:var(--text-faint);letter-spacing:1.5px}
.auth{display:flex;align-items:center;gap:10px;font-size:13.5px}
.auth .who{color:var(--text-dim)}
.btn{
  appearance:none;cursor:pointer;border:1px solid var(--line-strong);border-radius:8px;
  background:rgba(143,195,230,.08);color:var(--ice);font-family:var(--sans);
  font-size:13.5px;padding:7px 16px;min-height:36px;transition:background .18s,border-color .18s,color .18s
}
.btn:hover{background:rgba(143,195,230,.18);border-color:var(--ice)}
.btn-danger{border-color:rgba(224,68,60,.4);color:#ef8b85}
.btn-danger:hover{background:rgba(224,68,60,.14);border-color:var(--red)}
.search-row{margin-top:12px}
.search-box{position:relative;flex:1;min-width:220px}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text-faint);fill:none;stroke-width:2;stroke-linecap:round}
#searchInput{
  width:100%;appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--sans);font-size:16px;padding:11px 14px 11px 38px;min-height:44px;
  outline:none;transition:border-color .18s
}
#searchInput::placeholder{color:var(--text-faint)}
#searchInput:focus{border-color:var(--ice-deep)}
.post-count{font-size:12.5px;color:var(--text-faint);white-space:nowrap}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{
  appearance:none;cursor:pointer;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:var(--text-dim);font-family:var(--sans);font-size:12.5px;
  padding:4px 14px;min-height:30px;transition:all .18s
}
.chip:hover{color:var(--text);border-color:var(--line-strong)}
.chip.active{background:rgba(143,195,230,.16);color:var(--ice);border-color:var(--ice-deep)}

/* ===== 作品列表 ===== */
main{padding-top:22px;padding-bottom:30px}
.post-list{list-style:none;display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:820px){.post-list{grid-template-columns:repeat(2,1fr)}}
.post-card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px 16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;
  transition:border-color .18s,transform .18s,box-shadow .18s
}
.post-card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.28)}
.post-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.type-tag{
  font-size:12px;color:var(--ice);border:1px solid rgba(143,195,230,.4);border-radius:6px;
  padding:1px 9px;background:rgba(143,195,230,.08)
}
.sample-tag{font-size:11.5px;color:var(--warm);border:1px solid rgba(233,201,138,.4);border-radius:6px;padding:1px 8px;background:rgba(233,201,138,.08)}
.post-title{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--text);line-height:1.45}
.post-excerpt{font-size:14px;color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.post-by{font-size:12.5px;color:var(--text-faint)}
.post-by b{color:var(--text-dim);font-weight:500}
.post-actions{display:flex;align-items:center;gap:8px}
.like-btn{
  appearance:none;cursor:pointer;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:var(--text-dim);font-family:var(--sans);font-size:12.5px;
  display:inline-flex;align-items:center;gap:5px;padding:4px 11px;min-height:30px;transition:all .18s
}
.like-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.like-btn.liked{color:#ff6b63;border-color:rgba(255,107,99,.5);background:rgba(255,107,99,.1)}
.like-btn.liked svg{fill:#ff6b63;stroke:#ff6b63}
.like-btn:hover{border-color:var(--line-strong);color:var(--text)}
.link-read{appearance:none;background:none;border:none;cursor:pointer;color:var(--ice);font-size:13px;font-family:var(--sans);padding:4px 2px;min-height:30px}
.link-read:hover{text-decoration:underline}
.delete-btn{
  appearance:none;cursor:pointer;border:1px solid rgba(224,68,60,.35);border-radius:8px;
  background:transparent;color:#ef8b85;font-family:var(--sans);font-size:12.5px;
  padding:4px 12px;min-height:30px;transition:all .18s
}
.delete-btn:hover{background:rgba(224,68,60,.14);border-color:var(--red)}
.empty{text-align:center;color:var(--text-faint);font-size:14.5px;padding:70px 20px;border:1px dashed var(--line);border-radius:12px}

/* ===== 上传视图 ===== */
.form-card{max-width:720px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 26px 30px}
.back-link{display:inline-block;color:var(--ice);font-size:13.5px;text-decoration:none;margin-bottom:14px}
.back-link:hover{text-decoration:underline}
.form-card h2{font-family:var(--serif);font-size:21px;margin-bottom:20px;letter-spacing:1px}
.form-card label{display:block;font-size:13.5px;color:var(--text-dim);margin:16px 0 6px}
.form-card label .req{color:var(--red);margin-left:2px}
.form-card input,.form-card textarea{
  width:100%;appearance:none;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--sans);font-size:16px;padding:11px 14px;outline:none;transition:border-color .18s
}
.form-card textarea{resize:vertical;min-height:220px;line-height:1.8}
.form-card input:focus,.form-card textarea:focus{border-color:var(--ice-deep)}
.form-card input.invalid,.form-card textarea.invalid{border-color:var(--red)}
.field-err{color:#f2a09a;font-size:12.5px;margin-top:5px;min-height:0}
.form-tip{font-size:12.5px;color:var(--text-faint);margin:16px 0 4px}
.btn-submit{
  appearance:none;cursor:pointer;margin-top:14px;width:100%;
  background:linear-gradient(150deg,#2f6f9e,#1d4a70);border:1px solid var(--ice-deep);border-radius:10px;
  color:#f2f7fd;font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:3px;
  padding:13px 0;min-height:48px;transition:filter .18s,transform .18s
}
.btn-submit:hover{filter:brightness(1.12)}
.btn-submit:active{transform:scale(.985)}

/* ===== 底部 ===== */
.footer{font-size:13px;color:var(--text-faint);text-align:center;padding-top:14px;padding-bottom:34px;letter-spacing:.5px}
.footer::before{content:"";display:block;max-width:640px;margin:0 auto 16px;border-top:1px solid var(--line)}

/* ===== 红色 + 号 ===== */
.fab{
  position:fixed;right:26px;bottom:30px;z-index:65;
  width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(150deg,#ef5a52,#c7352e);
  box-shadow:0 8px 24px rgba(199,53,46,.5),0 0 0 1px rgba(255,255,255,.16) inset;
  display:none;align-items:center;justify-content:center;transition:transform .18s,filter .18s
}
.fab.show{display:flex}
.fab:hover{transform:scale(1.07);filter:brightness(1.08)}
.fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}

/* ===== 弹窗 ===== */
.modal{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(4,9,18,.72);backdrop-filter:blur(6px);padding:20px
}
.modal-panel{
  width:100%;max-width:720px;max-height:86vh;overflow:auto;
  background:var(--surface-solid);border:1px solid var(--line-strong);border-radius:14px;padding:26px 26px 22px;
  box-shadow:0 24px 70px rgba(0,0,0,.5)
}
.modal-panel.small{max-width:400px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.modal-head h3{font-family:var(--serif);font-size:19px;line-height:1.4}
.modal-close{
  appearance:none;cursor:pointer;background:none;border:none;width:34px;height:34px;flex:none;
  display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--text-dim);transition:background .18s
}
.modal-close:hover{background:rgba(143,195,230,.12);color:var(--text)}
.modal-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.detail-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--text-faint);margin-bottom:16px}
.detail-body{font-size:15.5px;color:var(--text);white-space:pre-wrap;line-height:2;word-break:break-word}
.detail-foot{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal .like-btn{font-size:13.5px;padding:7px 16px;min-height:38px}
.modal .like-btn svg{width:16px;height:16px}

/* 登录 */
.login-title{font-family:var(--serif);font-size:20px;text-align:center;margin-bottom:4px}
.login-sub{font-size:12.5px;color:var(--text-faint);text-align:center;margin-bottom:20px}
.login-form label{display:block;font-size:13px;color:var(--text-dim);margin:14px 0 6px}
.login-form input{
  width:100%;appearance:none;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-family:var(--sans);font-size:16px;padding:11px 14px;outline:none
}
.login-form input:focus{border-color:var(--ice-deep)}
.login-error{color:#f2a09a;font-size:12.5px;margin-top:12px;min-height:0}
.login-form .btn-submit{margin-top:18px}
.login-note{font-size:12px;color:var(--text-faint);text-align:center;margin-top:14px}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:36px;transform:translateX(-50%);z-index:90;
  background:rgba(24,38,64,.96);border:1px solid var(--line-strong);border-radius:999px;
  color:var(--text);font-size:13.5px;padding:10px 22px;box-shadow:0 8px 26px rgba(0,0,0,.4);
  animation:toastIn .22s ease
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (pointer:coarse){.chip,.like-btn,.delete-btn,.link-read,.btn{min-height:40px}}
</style>
</head>
<body>

<!-- ===== 顶部标头（图片内含“凛冬文学社”） ===== -->
<header class="hero"><img src="assets/banner.jpg" alt="凛冬文学社 标头图"></header>

<!-- ===== 左侧固定小方格：入社联系方式 ===== -->
<aside class="join-box" aria-label="申请入社联系方式">申请入社请加V:Sylyia0503</aside>

<!-- ===== 工具栏：品牌 / 登录 / 搜索 / 类型筛选 ===== -->
<nav class="toolbar" aria-label="站内导航">
  <div class="toolbar-inner">
    <div class="toolbar-row">
      <div class="brand">
        <span class="brand-mark">凛</span>
        <div><h1>凛冬文学社</h1><p>以文会友 · 凛冬共读</p></div>
      </div>
      <div class="auth" id="authArea"></div>
    </div>
    <div class="toolbar-row search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="search" placeholder="搜索题目 / 作者 / 类型" autocomplete="off">
      </div>
      <span class="post-count" id="postCount"></span>
    </div>
    <div class="chips" id="typeChips" aria-label="按类型筛选"></div>
  </div>
</nav>

<!-- ===== 主页视图：作品列表 ===== -->
<main class="wrap" id="view-home">
  <ul class="post-list" id="postList"></ul>
  <div class="empty" id="emptyState" hidden></div>
</main>

<!-- ===== 上传视图 ===== -->
<main class="wrap" id="view-upload" hidden>
  <section class="form-card" aria-label="发布新作品">
    <a class="back-link" href="#" data-action="back">返回首页</a>
    <h2>发布新作品</h2>
    <form id="postForm" novalidate>
      <label for="f-title">题目<span class="req">*</span></label>
      <input id="f-title" name="title" type="text" maxlength="40" placeholder="为你的作品起一个题目" autocomplete="off">
      <p class="field-err" data-for="title"></p>

      <label for="f-author">作者（笔名）<span class="req">*</span></label>
      <input id="f-author" name="author" type="text" maxlength="20" placeholder="你的笔名或署名" autocomplete="off">
      <p class="field-err" data-for="author"></p>

      <label for="f-type">类型<span class="req">*</span></label>
      <input id="f-type" name="type" type="text" maxlength="10" placeholder="如：诗歌、散文、小说、随笔" list="typeList" autocomplete="off">
      <datalist id="typeList">
        <option value="诗歌"></option><option value="散文"></option><option value="小说"></option>
        <option value="随笔"></option><option value="杂文"></option><option value="评论"></option>
        <option value="剧本"></option><option value="古风"></option>
      </datalist>
      <p class="field-err" data-for="type"></p>

      <label for="f-content">正文<span class="req">*</span></label>
      <textarea id="f-content" name="content" rows="12" placeholder="写下你的作品正文……"></textarea>
      <p class="field-err" data-for="content"></p>

      <p class="form-tip">题目、作者、类型、正文四项均为必填，全部填写后方可发布。</p>
      <button type="submit" class="btn-submit">发布作品</button>
    </form>
  </section>
</main>

<!-- ===== 底部声明 ===== -->
<footer class="wrap footer">本网页仅为学术交流，不做商业用途，盗用将追究法律责任。</footer>

<!-- ===== 作品详情弹窗 ===== -->
<div class="modal" id="detailModal" hidden role="dialog" aria-modal="true" aria-label="作品详情">
  <div class="modal-panel">
    <div class="modal-head">
      <h3 id="detailTitle"></h3>
      <button class="modal-close" data-action="closeDetail" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="detail-body" id="detailBody"></div>
    <div class="detail-foot" id="detailFoot"></div>
  </div>
</div>

<!-- ===== 登录弹窗 ===== -->
<div class="modal" id="loginModal" hidden role="dialog" aria-modal="true" aria-label="社员登录">
  <div class="modal-panel small">
    <div class="modal-head">
      <h3 class="login-title">凛冬文学社</h3>
      <button class="modal-close" data-action="closeLogin" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <p class="login-sub">编辑者登录后可发布与管理作品</p>
    <form class="login-form" id="loginForm" novalidate>
      <label for="loginUser">账号</label>
      <input id="loginUser" name="username" type="text" placeholder="请输入账号" autocomplete="off">
      <label for="loginPass">密码</label>
      <input id="loginPass" name="password" type="password" placeholder="请输入密码" autocomplete="off">
      <p class="login-error" id="loginError"></p>
      <button type="submit" class="btn-submit">登 录</button>
    </form>
    <p class="login-note">仅限凛冬文学社社员账号登录，游客可直接浏览与点赞</p>
  </div>
</div>

<!-- ===== 红色 + 号（仅登录编辑者可见） ===== -->
<button class="fab" id="fabBtn" aria-label="发布新作品" data-action="toUpload">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ===== 常量与数据 ===== */
var ACCOUNTS = { lingdong1: "lingdong2026", lingdong2: "lingdongadmin" };
var LS_POSTS = "lwxs_posts_v1", LS_LIKED = "lwxs_liked_v1", LS_USER = "lwxs_user_v1";

var SEED_POSTS = [
  { id:"seed-1", title:"雪落无声", author:"凛冬", type:"散文", isSample:true,
    content:"雪落在深夜的窗前，无声。炉火将熄，书页上还留着上午读到的一半句子。我想，所谓冬天，大概就是让一切慢下来的季节——让句子等一个句号，让思念等一个归人。",
    likes:16, createdAt:"2026-09-12T20:30:00+08:00" },
  { id:"seed-2", title:"寒江独钓", author:"墨白", type:"诗歌", isSample:true,
    content:"一竿风雪一竿秋，寒江之上月如钩。不问来路多少事，且钓孤舟万古愁。",
    likes:23, createdAt:"2026-10-01T09:15:00+08:00" },
  { id:"seed-3", title:"灯下书", author:"青灯", type:"随笔", isSample:true,
    content:"夜里翻旧信，纸已泛黄，字迹仍清。写信的人远在千里，读信的人守在灯下。有些话不必寄出，写下来的那一刻，就已经被读过。",
    likes:8, createdAt:"2026-10-10T22:40:00+08:00" },
  { id:"seed-4", title:"山海来信", author:"南枝", type:"小说", isSample:true,
    content:"第几天了？她把日历翻到最后一页，又倒回来。窗外山雾弥漫，邮差的车铃遥遥响起。她跑下台阶，接过那封没有署名的信——信里只有一句话：我在海的另一头，等你写完这个故事。",
    likes:12, createdAt:"2026-10-15T18:05:00+08:00" }
];

var posts, likedSet, currentUser, query = "", activeType = "";
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){
  return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c];
});};

/* ===== 持久化 ===== */
function loadPosts(){
  try{
    var raw = localStorage.getItem(LS_POSTS);
    if(raw){ posts = JSON.parse(raw); return; }
  }catch(e){}
  posts = SEED_POSTS.slice();
  savePosts();
}
function savePosts(){
  try{ localStorage.setItem(LS_POSTS, JSON.stringify(posts)); }catch(e){}
}
function loadLiked(){
  likedSet = new Set();
  try{
    var raw = localStorage.getItem(LS_LIKED);
    if(raw){ likedSet = new Set(JSON.parse(raw)); }
  }catch(e){}
}
function saveLiked(){ try{ localStorage.setItem(LS_LIKED, JSON.stringify(Array.from(likedSet))); }catch(e){} }
function loadUser(){
  try{ currentUser = localStorage.getItem(LS_USER) || null; }catch(e){ currentUser = null; }
}
function isEditor(){ return !!currentUser && !!ACCOUNTS[currentUser]; }
function fmtDate(iso){
  var d = new Date(iso); if(isNaN(d.getTime())) return "";
  var p = function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}

/* ===== Toast ===== */
var toastTimer = null;
function toast(msg){
  var t = $("toast");
  t.textContent = msg; t.hidden = false;
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 2400);
}

/* ===== 登录 / 退出 ===== */
function renderAuth(){
  var area = $("authArea");
  if(isEditor()){
    area.innerHTML = '<span class="who">编辑 · ' + esc(currentUser) + '</span>' +
      '<button class="btn" type="button" data-action="logout">退出</button>';
  }else{
    area.innerHTML = '<button class="btn" type="button" data-action="login">社员登录</button>';
  }
}
function tryLogin(){
  var u = $("loginUser").value.trim(), p = $("loginPass").value;
  var err = $("loginError");
  if(!u || !p){ err.textContent = "请输入账号和密码"; return; }
  if(!ACCOUNTS[u] || ACCOUNTS[u] !== p){ err.textContent = "账号或密码不正确，请核对后重试"; return; }
  currentUser = u;
  try{ localStorage.setItem(LS_USER, u); }catch(e){}
  $("loginForm").reset(); $("loginError").textContent = ""; $("loginModal").hidden = true;
  renderAuth(); refreshFab(); toast("登录成功，欢迎回来，" + u);
}
function logout(){
  currentUser = null;
  try{ localStorage.removeItem(LS_USER); }catch(e){}
  renderAuth(); refreshFab(); toast("已退出登录");
}

/* ===== 视图切换 ===== */
function showView(v){
  $("view-home").hidden = (v !== "home");
  $("view-upload").hidden = (v !== "upload");
  refreshFab();
  window.scrollTo(0, 0);
  if(v === "home") render();
}
function refreshFab(){
  $("fabBtn").classList.toggle("show", isEditor() && $("view-upload").hidden && !$("view-home").hidden);
}

/* ===== 渲染作品列表 ===== */
function renderChips(){
  var box = $("typeChips"), seen = {}, types = [];
  posts.forEach(function(p){ if(!seen[p.type]){ seen[p.type]=1; types.push(p.type); } });
  var html = '<button class="chip' + (activeType==="" ? " active" : "") + '" data-type="">全部</button>';
  types.forEach(function(t){
    html += '<button class="chip' + (activeType===t ? " active" : "") + '" data-type="' + esc(t) + '">' + esc(t) + "</button>";
  });
  box.innerHTML = html;
}
function render(){
  renderChips();
  var q = query.toLowerCase();
  var list = posts.filter(function(p){
    var hit = !q || p.title.toLowerCase().indexOf(q) >= 0 ||
              p.author.toLowerCase().indexOf(q) >= 0 ||
              p.type.toLowerCase().indexOf(q) >= 0;
    return hit && (!activeType || p.type === activeType);
  }).sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); });

  $("postCount").textContent = list.length + " 篇作品";

  var ul = $("postList");
  if(!list.length){
    ul.innerHTML = "";
    var empty = $("emptyState");
    empty.hidden = false;
    empty.textContent = (query || activeType) ? "没有找到符合条件的作品，换个关键词或类型试试。" :
      (isEditor() ? "还没有作品，点击右下角红色 + 号发布第一篇吧。" : "还没有作品，登录后即可发布第一篇。");
    return;
  }
  $("emptyState").hidden = true;
  var html = "";
  list.forEach(function(p){
    var liked = likedSet.has(p.id);
    html += '<li class="post-card" data-id="' + esc(p.id) + '">' +
      '<div class="post-meta">' +
        '<span class="type-tag">' + esc(p.type) + "</span>" +
        (p.isSample ? '<span class="sample-tag">示例</span>' : "") +
      "</div>" +
      '<h2 class="post-title">' + esc(p.title) + "</h2>" +
      '<p class="post-excerpt">' + esc(p.content) + "</p>" +
      '<div class="post-foot">' +
        '<span class="post-by">' + esc(p.author) + " · " + fmtDate(p.createdAt) + "</span>" +
        '<span class="post-actions">' +
          '<button class="like-btn' + (liked?" liked":"") + '" type="button" data-action="like" data-id="' + esc(p.id) + '" aria-label="点赞">' +
            '<svg viewBox="0 0 24 24"><path d="M12 21C7 16.6 3.5 13.4 3.5 9.9 3.5 7.5 5.4 5.7 7.7 5.7c1.6 0 3.1.8 4.3 2.1 1.2-1.3 2.7-2.1 4.3-2.1 2.3 0 4.2 1.8 4.2 4.2 0 3.5-3.5 6.7-8.5 11.1z"/></svg>' +
            '<span class="like-count">' + p.likes + "</span>" +
          "</button>" +
          (isEditor() ? '<button class="delete-btn" type="button" data-action="delete" data-id="' + esc(p.id) + '">删除</button>' : "") +
        "</span>" +
      "</div>" +
    "</li>";
  });
  ul.innerHTML = html;
  attachRendered();
}

/* ===== 详情弹窗 ===== */
var currentDetailId = null;
function openDetail(id){
  var p = null;
  posts.forEach(function(x){ if(x.id === id) p = x; });
  if(!p) return;
  currentDetailId = id;
  var liked = likedSet.has(id);
  $("detailTitle").textContent = p.title;
  $("detailMeta").innerHTML =
    '<span class="type-tag">' + esc(p.type) + "</span>" +
    (p.isSample ? '<span class="sample-tag">示例</span>' : "") +
    "<span>" + esc(p.author) + " · " + fmtDate(p.createdAt) + "</span>";
  $("detailBody").textContent = p.content;
  $("detailFoot").innerHTML =
    '<button class="like-btn' + (liked?" liked":"") + '" type="button" data-action="likeDetail" aria-label="点赞">' +
      '<svg viewBox="0 0 24 24"><path d="M12 21C7 16.6 3.5 13.4 3.5 9.9 3.5 7.5 5.4 5.7 7.7 5.7c1.6 0 3.1.8 4.3 2.1 1.2-1.3 2.7-2.1 4.3-2.1 2.3 0 4.2 1.8 4.2 4.2 0 3.5-3.5 6.7-8.5 11.1z"/></svg>' +
      '<span class="like-count">' + p.likes + "</span>" +
    "</button>" +
    (isEditor() ? '<button class="delete-btn" type="button" data-action="deleteDetail">删除此作品</button>' : "");
  $("detailModal").hidden = false;
}
function closeDetail(){ $("detailModal").hidden = true; currentDetailId = null; }
function syncDetail(){
  if(!currentDetailId) return;
  var p = null;
  posts.forEach(function(x){ if(x.id === currentDetailId) p = x; });
  if(!p){ closeDetail(); return; }
  var liked = likedSet.has(p.id);
  var foot = $("detailFoot");
  var likeBtn = foot.querySelector(".like-btn");
  if(likeBtn){ likeBtn.classList.toggle("liked", liked); likeBtn.querySelector(".like-count").textContent = p.likes; }
}

/* ===== 点赞 ===== */
function toggleLike(id){
  var p = null;
  posts.forEach(function(x){ if(x.id === id) p = x; });
  if(!p) return;
  if(likedSet.has(id)){ likedSet.delete(id); p.likes = Math.max(0, p.likes - 1); }
  else{ likedSet.add(id); p.likes += 1; }
  saveLiked(); savePosts(); render(); syncDetail();
}

/* ===== 删除 ===== */
function deletePost(id){
  var p = null;
  posts.forEach(function(x){ if(x.id === id) p = x; });
  if(!p) return;
  if(!window.confirm("确定删除作品《" + p.title + "》吗？删除后不可恢复。")) return;
  posts = posts.filter(function(x){ return x.id !== id; });
  likedSet.delete(id);
  savePosts(); saveLiked(); render();
  if(currentDetailId === id) closeDetail();
  toast("作品已删除");
}

/* ===== 发布 ===== */
function setErr(field, msg){
  var input = $("f-" + field), box = document.querySelector('.field-err[data-for="' + field + '"]');
  if(msg){ input.classList.add("invalid"); box.textContent = msg; }
  else{ input.classList.remove("invalid"); box.textContent = ""; }
}
function submitPost(){
  var title = $("f-title").value.trim();
  var author = $("f-author").value.trim();
  var type = $("f-type").value.trim();
  var content = $("f-content").value.trim();
  setErr("title", title ? "" : "请填写题目");
  setErr("author", author ? "" : "请填写作者（笔名）");
  setErr("type", type ? "" : "请填写类型");
  setErr("content", content ? "" : "请填写正文");
  if(!title || !author || !type || !content) return;
  posts.push({
    id: "p" + Date.now() + Math.floor(Math.random()*1000),
    title: title, author: author, type: type, content: content,
    isSample: false, likes: 0, createdAt: new Date().toISOString()
  });
  savePosts();
  $("postForm").reset();
  ["title","author","type","content"].forEach(function(f){ setErr(f,""); });
  showView("home");
  toast("作品《" + title + "》已发布");
}

/* ===== 事件绑定 ===== */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.getAttribute("data-action");
  switch(action){
    case "login": $("loginError").textContent = ""; $("loginModal").hidden = false; break;
    case "closeLogin": $("loginModal").hidden = true; break;
    case "logout": logout(); break;
    case "toUpload":
      if(!isEditor()){ toast("请先登录编辑账号"); break; }
      showView("upload");
      break;
    case "back":
      e.preventDefault(); showView("home");
      break;
    case "like":
      e.stopPropagation(); toggleLike(t.getAttribute("data-id"));
      break;
    case "delete":
      e.stopPropagation(); deletePost(t.getAttribute("data-id"));
      break;
    case "likeDetail": toggleLike(currentDetailId); break;
    case "deleteDetail": deletePost(currentDetailId); break;
    case "closeDetail": closeDetail(); break;
  }
});
/* 渲染后为动态元素绑定直接事件（供自检与可访问性检测） */
function attachRendered(){
  var ul = $("postList");
  ul.querySelectorAll(".post-card").forEach(function(card){
    card.addEventListener("click", function(e){
      var t = e.target.closest("[data-action]");
      if(t && (t.getAttribute("data-action") === "like" || t.getAttribute("data-action") === "delete")) return;
      openDetail(card.getAttribute("data-id"));
    });
    var like = card.querySelector("[data-action=like]");
    if(like) like.addEventListener("click", function(e){ e.stopPropagation(); toggleLike(like.getAttribute("data-id")); });
    var del = card.querySelector("[data-action=delete]");
    if(del) del.addEventListener("click", function(e){ e.stopPropagation(); deletePost(del.getAttribute("data-id")); });
  });
  $("typeChips").querySelectorAll(".chip").forEach(function(chip){
    chip.addEventListener("click", function(e){ e.stopPropagation(); activeType = chip.getAttribute("data-type") || ""; render(); });
  });
}

$("searchInput").addEventListener("input", function(){
  query = this.value.trim();
  render();
});
$("loginForm").addEventListener("submit", function(e){
  e.preventDefault(); tryLogin();
});
$("postForm").addEventListener("submit", function(e){
  e.preventDefault(); submitPost();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    $("detailModal").hidden = true;
    $("loginModal").hidden = true;
  }
});
[ "detailModal", "loginModal" ].forEach(function(id){
  $(id).addEventListener("click", function(e){
    if(e.target === this) this.hidden = true;
  });
});

/* ===== 初始化 ===== */
loadPosts(); loadLiked(); loadUser();
renderAuth(); refreshFab(); render();
})();
</script>
</body>
</html>
